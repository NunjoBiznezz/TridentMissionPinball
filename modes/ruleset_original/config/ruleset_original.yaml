#config_version=6

# Rule set 1: Original Stern Trident (1979) rules

mode:
  start_events: ruleset_original_selected, ruleset_trident2020_selected
  stop_events: game_ending
  priority: 210

# Phase-specific drop target banks.
# reset_on_complete is not set so targets are only raised by explicit coil_player events.
# Completion events are conditioned on current drop_phase so overlapping banks
# (e.g. phase_a fires when dt_2 and dt_4 are down regardless of phase) do not
# cause false phase transitions.
drop_target_banks:
  phase_a:
    drop_targets: dt_2, dt_4
  phase_b:
    drop_targets: dt_1, dt_3, dt_5
  phase_c:
    drop_targets: dt_1, dt_2, dt_4, dt_5
  phase_de:
    drop_targets: dt_1, dt_2, dt_3, dt_4, dt_5

accruals:
  standup_targets:
    events:
      - s_standup_white_active
      - s_standup_green_active
      - s_standup_amber_active
      - s_standup_yellow_active
      - s_standup_purple_active
    events_when_complete: standup_all_hit
    reset_on_complete: true
    disable_on_complete: false
    reset_events: ball_drain, mode_ruleset_original_started
    start_enabled: true

extra_balls:
  drop_target_special:
    award_events: special_award_extra_ball
  standup_extra_ball:
    award_events: collect_standup_extra_ball

event_player:
  # Phase completions — only act when in the matching phase
  drop_target_bank_phase_a_down{current_player.drop_phase == 1}: dt_phase_a_complete
  drop_target_bank_phase_b_down{current_player.drop_phase == 2}: dt_phase_b_complete
  drop_target_bank_phase_c_down{current_player.drop_phase == 3}: dt_phase_c_complete
  drop_target_bank_phase_de_down{current_player.drop_phase == 4}: dt_phase_d_complete
  drop_target_bank_phase_de_down{current_player.drop_phase == 5}: dt_phase_e_complete

  # Saucer hit during Phase E resets progression to Phase A (5X bonus stays earned)
  s_saucer_active{current_player.drop_phase == 5}: phase_e_saucer_reset

  # Outlane special: lit after 2nd target reset (setting=1) or 3rd target reset (setting=0)
  dt_phase_b_complete{machine.outlane_special_setting == 1}: outlane_special_earned
  dt_phase_c_complete{machine.outlane_special_setting == 0}: outlane_special_earned

  # Special award dispatch  1=100K pts  2=Free ball  3=Free game  4=Free ball+game
  dt_phase_e_complete{machine.special_award_setting == 1}: special_award_points
  dt_phase_e_complete{(machine.special_award_setting == 2 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 0}: special_award_extra_ball
  dt_phase_e_complete{(machine.special_award_setting == 2 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 1}: tournament_extra_ball_score
  dt_phase_e_complete{machine.special_award_setting == 3 or machine.special_award_setting == 4}: special_award_free_game

  # All 5 standup targets hit
  standup_all_hit{current_player.standup_completions == 0}: standup_first_complete
  standup_all_hit{current_player.standup_completions == 1}: standup_second_complete

  # Right inlane collects extra ball when lit (or scores points in tournament mode)
  s_right_inlane_active{current_player.extra_ball_lit == 1 and machine.adj_tournament_scoring == 0}: collect_standup_extra_ball
  s_right_inlane_active{current_player.extra_ball_lit == 1 and machine.adj_tournament_scoring == 1}: tournament_extra_ball_collect

  # Right outlane collects right special when lit
  s_right_outlane_active{current_player.right_special_lit == 1}: right_special_awarded

  # Right special dispatches same award as drop target special
  right_special_awarded{machine.special_award_setting == 1}: special_award_points
  right_special_awarded{(machine.special_award_setting == 2 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 0}: special_award_extra_ball
  right_special_awarded{(machine.special_award_setting == 2 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 1}: tournament_extra_ball_score
  right_special_awarded{machine.special_award_setting == 3 or machine.special_award_setting == 4}: special_award_free_game

  # Left inlane bonus advance: 1 step, max 19 (no handler at 19 = natural cap)
  s_left_inlane_active{current_player.bonus_steps == 0}: bonus_step_to_1
  s_left_inlane_active{current_player.bonus_steps == 1}: bonus_step_to_2
  s_left_inlane_active{current_player.bonus_steps == 2}: bonus_step_to_3
  s_left_inlane_active{current_player.bonus_steps == 3}: bonus_step_to_4
  s_left_inlane_active{current_player.bonus_steps == 4}: bonus_step_to_5
  s_left_inlane_active{current_player.bonus_steps == 5}: bonus_step_to_6
  s_left_inlane_active{current_player.bonus_steps == 6}: bonus_step_to_7
  s_left_inlane_active{current_player.bonus_steps == 7}: bonus_step_to_8
  s_left_inlane_active{current_player.bonus_steps == 8}: bonus_step_to_9
  s_left_inlane_active{current_player.bonus_steps == 9}: bonus_9_to_10
  s_left_inlane_active{current_player.bonus_steps == 10}: bonus_step_to_11
  s_left_inlane_active{current_player.bonus_steps == 11}: bonus_step_to_12
  s_left_inlane_active{current_player.bonus_steps == 12}: bonus_step_to_13
  s_left_inlane_active{current_player.bonus_steps == 13}: bonus_step_to_14
  s_left_inlane_active{current_player.bonus_steps == 14}: bonus_step_to_15
  s_left_inlane_active{current_player.bonus_steps == 15}: bonus_step_to_16
  s_left_inlane_active{current_player.bonus_steps == 16}: bonus_step_to_17
  s_left_inlane_active{current_player.bonus_steps == 17}: bonus_step_to_18
  s_left_inlane_active{current_player.bonus_steps == 18}: bonus_step_to_19

  # Right inlane bonus advance: +3 steps, max 19
  s_right_inlane_active{current_player.bonus_steps == 0}: bonus_0_to_3
  s_right_inlane_active{current_player.bonus_steps == 1}: bonus_1_to_4
  s_right_inlane_active{current_player.bonus_steps == 2}: bonus_2_to_5
  s_right_inlane_active{current_player.bonus_steps == 3}: bonus_3_to_6
  s_right_inlane_active{current_player.bonus_steps == 4}: bonus_4_to_7
  s_right_inlane_active{current_player.bonus_steps == 5}: bonus_5_to_8
  s_right_inlane_active{current_player.bonus_steps == 6}: bonus_6_to_9
  s_right_inlane_active{current_player.bonus_steps == 7}: bonus_7_to_10
  s_right_inlane_active{current_player.bonus_steps == 8}: bonus_8_to_10
  s_right_inlane_active{current_player.bonus_steps == 9}: bonus_9_to_10
  s_right_inlane_active{current_player.bonus_steps == 10}: bonus_10_to_13
  s_right_inlane_active{current_player.bonus_steps == 11}: bonus_11_to_14
  s_right_inlane_active{current_player.bonus_steps == 12}: bonus_12_to_15
  s_right_inlane_active{current_player.bonus_steps == 13}: bonus_13_to_16
  s_right_inlane_active{current_player.bonus_steps == 14}: bonus_14_to_17
  s_right_inlane_active{current_player.bonus_steps == 15}: bonus_15_to_18
  s_right_inlane_active{current_player.bonus_steps == 16}: bonus_16_to_19
  s_right_inlane_active{current_player.bonus_steps == 17}: bonus_17_to_19
  s_right_inlane_active{current_player.bonus_steps == 18}: bonus_18_to_19

  # Upper left rollover: advance left lane award (caps at 8,000)
  s_rollover_active{current_player.left_lane_value == 2000}: advance_lane_to_4k
  s_rollover_active{current_player.left_lane_value == 4000}: advance_lane_to_6k
  s_rollover_active{current_player.left_lane_value == 6000}: advance_lane_to_8k

  # Upper slings: score + bonus advance via common event
  s_ul_sling_active: upper_sling_hit
  s_ur_sling_active: upper_sling_hit

  # Lower slings: score only
  s_ll_sling_active: lower_sling_hit
  s_lr_sling_active: lower_sling_hit

  # Upper slings move purple bonus to opposite spinner
  s_ul_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 1}: purple_to_right
  s_ul_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 0}: purple_to_left
  s_ur_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 1}: purple_to_right
  s_ur_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 0}: purple_to_left

  # Upper sling bonus advance: +1 step, max 19
  upper_sling_hit{current_player.bonus_steps == 0}: bonus_step_to_1
  upper_sling_hit{current_player.bonus_steps == 1}: bonus_step_to_2
  upper_sling_hit{current_player.bonus_steps == 2}: bonus_step_to_3
  upper_sling_hit{current_player.bonus_steps == 3}: bonus_step_to_4
  upper_sling_hit{current_player.bonus_steps == 4}: bonus_step_to_5
  upper_sling_hit{current_player.bonus_steps == 5}: bonus_step_to_6
  upper_sling_hit{current_player.bonus_steps == 6}: bonus_step_to_7
  upper_sling_hit{current_player.bonus_steps == 7}: bonus_step_to_8
  upper_sling_hit{current_player.bonus_steps == 8}: bonus_step_to_9
  upper_sling_hit{current_player.bonus_steps == 9}: bonus_9_to_10
  upper_sling_hit{current_player.bonus_steps == 10}: bonus_step_to_11
  upper_sling_hit{current_player.bonus_steps == 11}: bonus_step_to_12
  upper_sling_hit{current_player.bonus_steps == 12}: bonus_step_to_13
  upper_sling_hit{current_player.bonus_steps == 13}: bonus_step_to_14
  upper_sling_hit{current_player.bonus_steps == 14}: bonus_step_to_15
  upper_sling_hit{current_player.bonus_steps == 15}: bonus_step_to_16
  upper_sling_hit{current_player.bonus_steps == 16}: bonus_step_to_17
  upper_sling_hit{current_player.bonus_steps == 17}: bonus_step_to_18
  upper_sling_hit{current_player.bonus_steps == 18}: bonus_step_to_19

variable_player:
  # Initialize on mode start
  mode_ruleset_original_started:
    drop_phase:
      int: 1
      action: set
    saucer_value:
      int: 5000
      action: set
    bonus_multiplier:
      int: 1
      action: set
    left_lane_value:
      int: 2000
      action: set
    left_spinner_value:
      int: 200
      action: set
    right_spinner_value:
      int: 200
      action: set
    purple_bonus:
      int: 0
      action: set
    purple_on_left:
      int: 1
      action: set
    white_applied:
      int: 0
      action: set
    amber_applied:
      int: 0
      action: set
    green_applied:
      int: 0
      action: set
    yellow_applied:
      int: 0
      action: set
    purple_applied:
      int: 0
      action: set
    standup_completions:
      int: 0
      action: set
    extra_ball_lit:
      int: 0
      action: set
    right_special_lit:
      int: 0
      action: set
    bonus_steps:
      int: 1
      action: set

  # Phase A complete: earn 2X, saucer advances to 10,000
  dt_phase_a_complete:
    drop_phase:
      int: 2
      action: set
    bonus_multiplier:
      int: 2
      action: set
    saucer_value:
      int: 10000
      action: set

  # Phase B complete: earn 3X, saucer advances to 20,000
  dt_phase_b_complete:
    drop_phase:
      int: 3
      action: set
    bonus_multiplier:
      int: 3
      action: set
    saucer_value:
      int: 20000
      action: set

  # Phase C complete: earn 4X, saucer advances to 30,000 (maximum)
  dt_phase_c_complete:
    drop_phase:
      int: 4
      action: set
    bonus_multiplier:
      int: 4
      action: set
    saucer_value:
      int: 30000
      action: set

  # Phase D complete: earn 5X
  dt_phase_d_complete:
    drop_phase:
      int: 5
      action: set
    bonus_multiplier:
      int: 5
      action: set

  # Saucer always scores its current award value
  s_saucer_active:
    score: current_player.saucer_value

  # Special award: 100,000 points option
  special_award_points:
    score: 100000

  # Tournament mode: score points instead of awarding extra ball
  tournament_extra_ball_score:
    score: machine.adj_extra_ball_award
  tournament_extra_ball_collect:
    score: machine.adj_extra_ball_award
    extra_ball_lit:
      int: 0
      action: set

  # Phase E saucer reset: return to Phase A, saucer resets to 5,000
  # Earned multiplier lamps and bonus_multiplier are preserved intentionally
  phase_e_saucer_reset:
    drop_phase:
      int: 1
      action: set
    saucer_value:
      int: 5000
      action: set

  # Upper slingshots: 1,000 points
  upper_sling_hit:
    score: 1000

  # Lower slingshots: 10 points
  lower_sling_hit:
    score: 10

  # Upper left rollover: 100 points
  s_rollover_active:
    score: 100

  # Left lane advance steps
  advance_lane_to_4k:
    left_lane_value:
      int: 4000
      action: set
  advance_lane_to_6k:
    left_lane_value:
      int: 6000
      action: set
  advance_lane_to_8k:
    left_lane_value:
      int: 8000
      action: set

  # Lower left return lane scores current award value
  s_left_inlane_active:
    score: current_player.left_lane_value

  # Right return lane: 3000 points + bonus advance (handled via event_player dispatch)
  s_right_inlane_active:
    score: 3000

  # Bonus counter step events: update bonus_steps and light only the new lamps
  bonus_0_to_3:
    bonus_steps:
      int: 3
      action: set
  bonus_1_to_4:
    bonus_steps:
      int: 4
      action: set
  bonus_2_to_5:
    bonus_steps:
      int: 5
      action: set
  bonus_3_to_6:
    bonus_steps:
      int: 6
      action: set
  bonus_4_to_7:
    bonus_steps:
      int: 7
      action: set
  bonus_5_to_8:
    bonus_steps:
      int: 8
      action: set
  bonus_6_to_9:
    bonus_steps:
      int: 9
      action: set
  bonus_7_to_10:
    bonus_steps:
      int: 10
      action: set
  bonus_8_to_10:
    bonus_steps:
      int: 10
      action: set
  bonus_9_to_10:
    bonus_steps:
      int: 10
      action: set

  # Single-step bonus advances (left inlane)
  bonus_step_to_1:
    bonus_steps:
      int: 1
      action: set
  bonus_step_to_2:
    bonus_steps:
      int: 2
      action: set
  bonus_step_to_3:
    bonus_steps:
      int: 3
      action: set
  bonus_step_to_4:
    bonus_steps:
      int: 4
      action: set
  bonus_step_to_5:
    bonus_steps:
      int: 5
      action: set
  bonus_step_to_6:
    bonus_steps:
      int: 6
      action: set
  bonus_step_to_7:
    bonus_steps:
      int: 7
      action: set
  bonus_step_to_8:
    bonus_steps:
      int: 8
      action: set
  bonus_step_to_9:
    bonus_steps:
      int: 9
      action: set

  # Second-pass single-step advances (11–19); l_bonus_10 stays lit
  bonus_step_to_11:
    bonus_steps: {int: 11, action: set}
  bonus_step_to_12:
    bonus_steps: {int: 12, action: set}
  bonus_step_to_13:
    bonus_steps: {int: 13, action: set}
  bonus_step_to_14:
    bonus_steps: {int: 14, action: set}
  bonus_step_to_15:
    bonus_steps: {int: 15, action: set}
  bonus_step_to_16:
    bonus_steps: {int: 16, action: set}
  bonus_step_to_17:
    bonus_steps: {int: 17, action: set}
  bonus_step_to_18:
    bonus_steps: {int: 18, action: set}
  bonus_step_to_19:
    bonus_steps: {int: 19, action: set}

  # Right inlane multi-step advances for the second pass (+3, caps at 19)
  bonus_10_to_13:
    bonus_steps: {int: 13, action: set}
  bonus_11_to_14:
    bonus_steps: {int: 14, action: set}
  bonus_12_to_15:
    bonus_steps: {int: 15, action: set}
  bonus_13_to_16:
    bonus_steps: {int: 16, action: set}
  bonus_14_to_17:
    bonus_steps: {int: 17, action: set}
  bonus_15_to_18:
    bonus_steps: {int: 18, action: set}
  bonus_16_to_19:
    bonus_steps: {int: 19, action: set}
  bonus_17_to_19:
    bonus_steps: {int: 19, action: set}
  bonus_18_to_19:
    bonus_steps: {int: 19, action: set}

  # Standup target completions
  standup_first_complete:
    standup_completions:
      int: 1
      action: set
    extra_ball_lit:
      int: 1
      action: set
  standup_second_complete:
    standup_completions:
      int: 2
      action: set
    right_special_lit:
      int: 1
      action: set
  outlane_special_earned:
    right_special_lit:
      int: 1
      action: set
  collect_standup_extra_ball:
    extra_ball_lit:
      int: 0
      action: set
  right_special_awarded:
    right_special_lit:
      int: 0
      action: set

  # Standup targets: 1000 points every hit; spinner increase only on first hit per ball
  s_standup_white_active:
    score: 1000
  s_standup_white_active{current_player.white_applied == 0}:
    left_spinner_value:
      int: 400
      action: add
    white_applied:
      int: 1
      action: set
  s_standup_amber_active:
    score: 1000
  s_standup_amber_active{current_player.amber_applied == 0}:
    left_spinner_value:
      int: 400
      action: add
    amber_applied:
      int: 1
      action: set
  s_standup_green_active:
    score: 1000
  s_standup_green_active{current_player.green_applied == 0}:
    right_spinner_value:
      int: 400
      action: add
    green_applied:
      int: 1
      action: set
  s_standup_yellow_active:
    score: 1000
  s_standup_yellow_active{current_player.yellow_applied == 0}:
    right_spinner_value:
      int: 400
      action: add
    yellow_applied:
      int: 1
      action: set
  # Purple always moves bonus to left; value increase only on first hit
  s_standup_purple_active:
    score: 1000
    purple_on_left:
      int: 1
      action: set
  s_standup_purple_active{current_player.purple_applied == 0}:
    purple_bonus:
      int: 1000
      action: add
    purple_applied:
      int: 1
      action: set

  # Spinner scoring: suppressed during Feeding Frenzy (ff_active == 1) which scores 5K flat
  s_left_spinner_active{current_player.ff_active == 0}:
    score: current_player.left_spinner_value
  s_left_spinner_active{current_player.purple_on_left == 1 and current_player.ff_active == 0}:
    score: current_player.purple_bonus
  s_right_spinner_active{current_player.ff_active == 0}:
    score: current_player.right_spinner_value
  s_right_spinner_active{current_player.purple_on_left == 0 and current_player.ff_active == 0}:
    score: current_player.purple_bonus

  # Purple bonus side swaps
  purple_to_right:
    purple_on_left:
      int: 0
      action: set
  purple_to_left:
    purple_on_left:
      int: 1
      action: set

  # Ball drain: award bonus then reset all per-ball state to initial values
  ball_drain:
    score: current_player.bonus_steps * 1000 * current_player.bonus_multiplier
    drop_phase:
      int: 1
      action: set
    saucer_value:
      int: 5000
      action: set
    left_lane_value:
      int: 2000
      action: set
    left_spinner_value:
      int: 200
      action: set
    right_spinner_value:
      int: 200
      action: set
    purple_bonus:
      int: 0
      action: set
    purple_on_left:
      int: 1
      action: set
    white_applied:
      int: 0
      action: set
    amber_applied:
      int: 0
      action: set
    green_applied:
      int: 0
      action: set
    yellow_applied:
      int: 0
      action: set
    purple_applied:
      int: 0
      action: set
    standup_completions:
      int: 0
      action: set
    extra_ball_lit:
      int: 0
      action: set
    right_special_lit:
      int: 0
      action: set
    bonus_steps:
      int: 1
      action: set

coil_player:
  # Game start: raise targets 2 and 4
  mode_ruleset_original_started:
    c_drop_target_2: pulse
    c_drop_target_4: pulse

  # Phase A complete: raise all 5 so Phase B starts clean.
  # Raising 2 and 4 here (in addition to 1, 3, 5) prevents the Phase C
  # bank from falsely completing when 1, 3, 5 go down during Phase B
  # (because the bank also tracks 2 and 4, which were still down from Phase A).
  dt_phase_a_complete:
    c_drop_target_1: pulse
    c_drop_target_2: pulse
    c_drop_target_3: pulse
    c_drop_target_4: pulse
    c_drop_target_5: pulse

  # Phase B complete: raise all 5 so Phase C starts clean.
  # Raising target 3 here prevents the phase_de bank from falsely
  # completing during Phase C (target 3 would otherwise still be down,
  # making all 5 targets down the moment Phase C's four targets are hit).
  dt_phase_b_complete:
    c_drop_target_1: pulse
    c_drop_target_2: pulse
    c_drop_target_3: pulse
    c_drop_target_4: pulse
    c_drop_target_5: pulse

  # Phases C, D, E complete: raise all 5.
  # Individual coils used so smart_virtual can track each switch release;
  # the physical reset bar (c_drop_target_reset) achieves the same result
  # on real hardware but is opaque to the virtual platform.
  dt_phase_c_complete:
    c_drop_target_1: pulse
    c_drop_target_2: pulse
    c_drop_target_3: pulse
    c_drop_target_4: pulse
    c_drop_target_5: pulse
  dt_phase_d_complete:
    c_drop_target_1: pulse
    c_drop_target_2: pulse
    c_drop_target_3: pulse
    c_drop_target_4: pulse
    c_drop_target_5: pulse
  dt_phase_e_complete:
    c_drop_target_1: pulse
    c_drop_target_2: pulse
    c_drop_target_3: pulse
    c_drop_target_4: pulse
    c_drop_target_5: pulse

  # Phase E saucer reset: raise only targets 2 and 4 to restart Phase A
  phase_e_saucer_reset:
    c_drop_target_2: pulse
    c_drop_target_4: pulse

  # Ball drain: raise targets 2 and 4 ready for the next ball
  ball_drain:
    c_drop_target_2: pulse
    c_drop_target_4: pulse

light_player:
  # Game start state
  mode_ruleset_original_started:
    l_bonus_2x_feature: on
    l_bonus_3x_feature: off
    l_bonus_4x_feature: off
    l_bonus_5x_feature: off
    l_bonus_2x: off
    l_bonus_3x: off
    l_bonus_4x: off
    l_bonus_5x: off
