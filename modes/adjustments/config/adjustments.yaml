  adjustments_advance_to_11: adjustments_show_setting_11
  s_start_button_active{machine.adj_setting == 11}: adjustments_advance_to_12
  adjustments_advance_to_12: adjustments_show_setting_12
  s_start_button_active{machine.adj_setting == 12}: adjustments_advance_to_13
  adjustments_advance_to_13: adjustments_show_setting_13
  s_start_button_active{machine.adj_setting == 13}: adjustments_advance_to_14
  adjustments_advance_to_14: adjustments_show_setting_14
  s_start_button_active{machine.adj_setting == 14}: adjustments_advance_to_15
  adjustments_advance_to_15: adjustments_show_setting_15
  s_start_button_active{machine.adj_setting == 15}: adjustments_advance_to_16
  adjustments_advance_to_16: adjustments_show_setting_16
  s_start_button_active{machine.adj_setting == 16}: adjustments_advance_to_17
  adjustments_advance_to_17: adjustments_show_setting_17
