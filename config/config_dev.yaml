#config_version=6

# Development configuration for laptop testing
# Overrides main config for simulation

config:
  - config.yaml
  - ../machine_files/stern_trident.yaml

hardware:
  platform: virtual
  driverboards: virtual
  switches: virtual
  coils: virtual
  lights: virtual

# Virtual hardware for testing
virtual_platform_start_active_switches:
  - s_outhole

# In virtual/smart_virtual there is no downstream device to confirm the eject,
# so use 'fake' to let the trough immediately confirm the ball left.
ball_devices:
  bd_trough:
    confirm_eject_type: fake

# Development logging
logging:
  console:
    level: DEBUG
  file:
    level: DEBUG
    filename: logs/mpf_dev.log

# Faster development settings
mpf:
  default_platform_hz: 30  # Lower for development
  
bcp:
  connections:
    local_display:
      type: mpf.core.bcp.bcp_socket_client.BCPClientSocket
      host: localhost
      port: 5050