#config_version=6

# Adjustments mode
#
# Entry:      advance past the last self-test (test 5)
# Toggle:     press s_service to flip current adjustment on (1) or off (0)
# Next:       press s_start_button to advance to the next adjustment
# Exit:       pressing s_start_button past the last adjustment returns to attract
#
# Adjustments:
#   1  - Award Score 1
#   2  - Award Score 2
#   3  - Award Score 3
#   4  - High Score
#   5  - Total Credits
#   6  - Total Plays
#   7  - Total Replays
#   8  - High Score Beaten
#   9  - Chute 2 Coins
#  10  - Chute 1 Coins
#  11  - Chute 3 Coins
#  12  - Reboot with Credit/Reset Button
#  13  - Chute 1 Coins Per Credit
#  14  - Chute 2 Coins Per Credit
#  15  - Chute 3 Coins Per Credit
#  16  - Free Play
#  17  - Ball Save

mode:
  start_events: enter_adjustments
  stop_events: adjustments_exit, enter_service_menu
  priority: 70
  game_mode: false

event_player:
  mode_adjustments_started: adjustments_show_setting_1

  # --- Adjustment 1: Award Score 1 ---
  s_service_active{machine.adj_setting == 1 and machine.adj_award_score_1 == 0}: adj_award_score_1_on
  s_service_active{machine.adj_setting == 1 and machine.adj_award_score_1 == 1}: adj_award_score_1_off
  adj_award_score_1_on: adjustments_show_setting_1
  adj_award_score_1_off: adjustments_show_setting_1

