#config_version=6

# Adjustments mode
#
# Entry:      advance past the last self-test (test 5)
# Toggle:     press s_service to flip current adjustment on (1) or off (0)
# Next:       press s_start_button to advance to the next adjustment
# Exit:       pressing s_start_button past the last adjustment returns to attract
#
# Adjustments:
#   1  - Award Score 1
#   2  - Award Score 2
#   3  - Award Score 3
#   4  - High Score
#   5  - Total Credits
#   6  - Total Plays
#   7  - Total Replays
#   8  - High Score Beaten
#   9  - Chute 2 Coins
#  10  - Chute 1 Coins
#  11  - Chute 3 Coins
#  12  - Reboot with Credit/Reset Button
#  13  - Chute 1 Coins Per Credit
#  14  - Chute 2 Coins Per Credit
#  15  - Chute 3 Coins Per Credit
#  16  - Free Play
#  17  - Ball Save

mode:
  start_events: enter_adjustments
  stop_events: adjustments_exit, enter_service_menu
  priority: 70
  game_mode: false

event_player:
  mode_adjustments_started: adjustments_show_setting_1

  # --- Adjustment 1: Award Score 1 ---
  s_service_active{machine.adj_setting == 1 and machine.adj_award_score_1 == 0}: adj_award_score_1_on
  s_service_active{machine.adj_setting == 1 and machine.adj_award_score_1 == 1}: adj_award_score_1_off
  adj_award_score_1_on: adjustments_show_setting_1
  adj_award_score_1_off: adjustments_show_setting_1

  # --- Adjustment 2: Award Score 2 ---
  s_service_active{machine.adj_setting == 2 and machine.adj_award_score_2 == 0}: adj_award_score_2_on
  s_service_active{machine.adj_setting == 2 and machine.adj_award_score_2 == 1}: adj_award_score_2_off
  adj_award_score_2_on: adjustments_show_setting_2
  adj_award_score_2_off: adjustments_show_setting_2

  # --- Adjustment 3: Award Score 3 ---
  s_service_active{machine.adj_setting == 3 and machine.adj_award_score_3 == 0}: adj_award_score_3_on
  s_service_active{machine.adj_setting == 3 and machine.adj_award_score_3 == 1}: adj_award_score_3_off
  adj_award_score_3_on: adjustments_show_setting_3
  adj_award_score_3_off: adjustments_show_setting_3

  # --- Adjustment 4: High Score ---
  s_service_active{machine.adj_setting == 4 and machine.adj_high_score == 0}: adj_high_score_on
  s_service_active{machine.adj_setting == 4 and machine.adj_high_score == 1}: adj_high_score_off
  adj_high_score_on: adjustments_show_setting_4
  adj_high_score_off: adjustments_show_setting_4

  # --- Adjustment 5: Total Credits ---
  s_service_active{machine.adj_setting == 5 and machine.adj_total_credits == 0}: adj_total_credits_on
  s_service_active{machine.adj_setting == 5 and machine.adj_total_credits == 1}: adj_total_credits_off
  adj_total_credits_on: adjustments_show_setting_5
  adj_total_credits_off: adjustments_show_setting_5

  # --- Adjustment 6: Total Plays ---
  s_service_active{machine.adj_setting == 6 and machine.adj_total_plays == 0}: adj_total_plays_on
  s_service_active{machine.adj_setting == 6 and machine.adj_total_plays == 1}: adj_total_plays_off
  adj_total_plays_on: adjustments_show_setting_6
  adj_total_plays_off: adjustments_show_setting_6

  # --- Adjustment 7: Total Replays ---
  s_service_active{machine.adj_setting == 7 and machine.adj_total_replays == 0}: adj_total_replays_on
  s_service_active{machine.adj_setting == 7 and machine.adj_total_replays == 1}: adj_total_replays_off
  adj_total_replays_on: adjustments_show_setting_7
  adj_total_replays_off: adjustments_show_setting_7

  # --- Adjustment 8: High Score Beaten ---
  s_service_active{machine.adj_setting == 8 and machine.adj_high_score_beaten == 0}: adj_high_score_beaten_on
  s_service_active{machine.adj_setting == 8 and machine.adj_high_score_beaten == 1}: adj_high_score_beaten_off
  adj_high_score_beaten_on: adjustments_show_setting_8
  adj_high_score_beaten_off: adjustments_show_setting_8

  # --- Adjustment 9: Chute 2 Coins ---
  s_service_active{machine.adj_setting == 9 and machine.adj_chute_2_coins == 0}: adj_chute_2_coins_on
  s_service_active{machine.adj_setting == 9 and machine.adj_chute_2_coins == 1}: adj_chute_2_coins_off
