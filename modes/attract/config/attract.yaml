#config_version=6

mode:
  start_events: machine_reset_phase_3, game_ended, ball_will_end{device.ball_devices.trough.balls > 0}
  stop_events: game_start_request
  priority: 10
  game_mode: false
  events_when_started: start_attract_mode
  events_when_stopped: stop_attract_mode

variable_player:
  s_left_flipper_active{machine.current_ruleset < 3}:
    current_ruleset:
      int: machine.current_ruleset + 1
      action: set_machine
  s_left_flipper_active{machine.current_ruleset >= 3}:
    current_ruleset:
      int: 1
      action: set_machine
# TODO: add sound or display feedback tied to current_ruleset_machine_var_changed

