#config_version=6

# Rule set 1: Original Stern Trident (1979) rules

mode:
  start_events: ruleset_original_selected
  stop_events: game_ending
  priority: 210

# Phase-specific drop target banks.
# reset_on_complete is not set so targets are only raised by explicit coil_player events.
# Completion events are conditioned on current drop_phase so overlapping banks
# (e.g. phase_a fires when dt_2 and dt_4 are down regardless of phase) do not
# cause false phase transitions.
drop_target_banks:
  phase_a:
    drop_targets: dt_2, dt_4
  phase_b:
    drop_targets: dt_1, dt_3, dt_5
  phase_c:
    drop_targets: dt_1, dt_2, dt_4, dt_5
  phase_de:
    drop_targets: dt_1, dt_2, dt_3, dt_4, dt_5

extra_balls:
  drop_target_special:
    award_events: special_award_extra_ball

event_player:
  # Phase completions — only act when in the matching phase
  drop_target_bank_phase_a_complete{current_player.drop_phase == 1}: dt_phase_a_complete
  drop_target_bank_phase_b_complete{current_player.drop_phase == 2}: dt_phase_b_complete
  drop_target_bank_phase_c_complete{current_player.drop_phase == 3}: dt_phase_c_complete
  drop_target_bank_phase_de_complete{current_player.drop_phase == 4}: dt_phase_d_complete
  drop_target_bank_phase_de_complete{current_player.drop_phase == 5}: dt_phase_e_complete

  # Saucer hit during Phase E resets progression to Phase A (5X bonus stays earned)
  s_saucer_active{current_player.drop_phase == 5}: phase_e_saucer_reset

  # Special award dispatch based on machine setting
  dt_phase_e_complete{settings.special_award == "extra_ball" or settings.special_award == "extra_ball_and_free_game"}: special_award_extra_ball
  dt_phase_e_complete{settings.special_award == "free_game" or settings.special_award == "extra_ball_and_free_game"}: special_award_free_game
  dt_phase_e_complete{settings.special_award == "points_100k"}: special_award_points

  # Upper left rollover: advance left lane award (caps at 8,000)
  s_rollover_active{current_player.left_lane_value == 2000}: advance_lane_to_4k
  s_rollover_active{current_player.left_lane_value == 4000}: advance_lane_to_6k
  s_rollover_active{current_player.left_lane_value == 6000}: advance_lane_to_8k

variable_player:
  # Initialize on mode start
  mode_ruleset_original_started:
    drop_phase:
      int: 1
      action: set
    saucer_value:
      int: 5000
      action: set
    bonus_multiplier:
      int: 1
      action: set
    left_lane_value:
      int: 2000
      action: set

  # Phase A complete: earn 2X, saucer advances to 10,000
  dt_phase_a_complete:
    drop_phase:
      int: 2
      action: set
    bonus_multiplier:
      int: 2
      action: set
    saucer_value:
      int: 10000
      action: set

  # Phase B complete: earn 3X, saucer advances to 20,000
  dt_phase_b_complete:
    drop_phase:
      int: 3
      action: set
    bonus_multiplier:
      int: 3
      action: set
    saucer_value:
      int: 20000
      action: set

  # Phase C complete: earn 4X, saucer advances to 30,000 (maximum)
  dt_phase_c_complete:
    drop_phase:
      int: 4
      action: set
    bonus_multiplier:
      int: 4
      action: set
    saucer_value:
      int: 30000
      action: set

  # Phase D complete: earn 5X
  dt_phase_d_complete:
    drop_phase:
      int: 5
      action: set
    bonus_multiplier:
      int: 5
      action: set

  # Saucer always scores its current award value
  s_saucer_active:
    score: current_player.saucer_value

  # Special award: 100,000 points option
  special_award_points:
    score: 100000

  # Phase E saucer reset: return to Phase A, saucer resets to 5,000
  # Earned multiplier lamps and bonus_multiplier are preserved intentionally
  phase_e_saucer_reset:
    drop_phase:
      int: 1
      action: set
    saucer_value:
      int: 5000
      action: set

  # Upper left rollover: 100 points
  s_rollover_active:
    score: 100

  # Left lane advance steps
  advance_lane_to_4k:
    left_lane_value:
      int: 4000
      action: set
  advance_lane_to_6k:
    left_lane_value:
      int: 6000
      action: set
  advance_lane_to_8k:
    left_lane_value:
      int: 8000
      action: set

  # Lower left return lane scores current award value
  s_left_inlane_active:
    score: current_player.left_lane_value

  # Ball drain: reset saucer value, drop phase, and lane value to initial state
  ball_drain:
    drop_phase:
      int: 1
      action: set
    saucer_value:
      int: 5000
      action: set
    left_lane_value:
      int: 2000
      action: set

coil_player:
  # Game start: raise targets 2 and 4
  mode_ruleset_original_started:
    c_drop_target_2: pulse
    c_drop_target_4: pulse

  # Phase A complete: raise targets 1, 3, 5
  dt_phase_a_complete:
    c_drop_target_1: pulse
    c_drop_target_3: pulse
    c_drop_target_5: pulse

  # Phase B complete: raise targets 1, 2, 4, 5 (target 3 stays down)
  dt_phase_b_complete:
    c_drop_target_1: pulse
    c_drop_target_2: pulse
    c_drop_target_4: pulse
    c_drop_target_5: pulse

  # Phases C, D, E complete: raise all 5
  dt_phase_c_complete:
    c_drop_target_reset: pulse
  dt_phase_d_complete:
    c_drop_target_reset: pulse
  dt_phase_e_complete:
    c_drop_target_reset: pulse

  # Phase E saucer reset: raise only targets 2 and 4 to restart Phase A
  phase_e_saucer_reset:
    c_drop_target_2: pulse
    c_drop_target_4: pulse

  # Ball drain: raise targets 2 and 4 ready for the next ball
  ball_drain:
    c_drop_target_2: pulse
    c_drop_target_4: pulse

light_player:
  # Game start state
  mode_ruleset_original_started:
    l_bonus_2x_feature: on
    l_bonus_3x_feature: off
    l_bonus_4x_feature: off
    l_bonus_5x_feature: off
    l_bonus_2x: off
    l_bonus_3x: off
    l_bonus_4x: off
    l_bonus_5x: off
    l_top_eject_5k: on
    l_top_eject_10k: off
    l_top_eject_20k: off
    l_top_eject_30k: off
    l_drop_target_special: off
    l_left_lane_2k: on
    l_left_lane_4k: off
    l_left_lane_6k: off
    l_left_lane_8k: off

  # Phase A complete: 2X earned, 3X feature lit, saucer 10K
  dt_phase_a_complete:
    l_bonus_2x: on
    l_bonus_2x_feature: off
    l_bonus_3x_feature: on
    l_top_eject_5k: off
    l_top_eject_10k: on

  # Phase B complete: 3X earned, 4X feature lit, saucer 20K
  dt_phase_b_complete:
    l_bonus_3x: on
    l_bonus_3x_feature: off
    l_bonus_4x_feature: on
    l_top_eject_10k: off
    l_top_eject_20k: on

  # Phase C complete: 4X earned, 5X feature lit, saucer 30K
  dt_phase_c_complete:
    l_bonus_4x: on
    l_bonus_4x_feature: off
    l_bonus_5x_feature: on
    l_top_eject_20k: off
    l_top_eject_30k: on

  # Phase D complete: 5X earned, special mode begins
  dt_phase_d_complete:
    l_bonus_5x: on
    l_bonus_5x_feature: off
    l_drop_target_special: on

  # Left lane advance lamps
  advance_lane_to_4k:
    l_left_lane_2k: off
    l_left_lane_4k: on
  advance_lane_to_6k:
    l_left_lane_4k: off
    l_left_lane_6k: on
  advance_lane_to_8k:
    l_left_lane_6k: off
    l_left_lane_8k: on

  # Ball drain: reset lamps to initial Phase A state
  ball_drain:
    l_bonus_2x_feature: on
    l_bonus_3x_feature: off
    l_bonus_4x_feature: off
    l_bonus_5x_feature: off
    l_top_eject_5k: on
    l_top_eject_10k: off
    l_top_eject_20k: off
    l_top_eject_30k: off
    l_drop_target_special: off
    l_left_lane_2k: on
    l_left_lane_4k: off
    l_left_lane_6k: off
    l_left_lane_8k: off

  # Phase E saucer reset: return to Phase A lamp state
  # Earned multiplier lamps (l_bonus_2x through l_bonus_5x) are intentionally
  # NOT turned off — the 5X (and all earned multipliers) remain lit
  phase_e_saucer_reset:
    l_bonus_2x_feature: on
    l_bonus_3x_feature: off
    l_bonus_4x_feature: off
    l_bonus_5x_feature: off
    l_top_eject_5k: on
    l_top_eject_10k: off
    l_top_eject_20k: off
    l_top_eject_30k: off
    l_drop_target_special: off
