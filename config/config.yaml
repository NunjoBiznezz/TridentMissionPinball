#config_version=6

mpf:
  default_platform_hz: 1000

machine:
  balls_installed: 3
  min_balls: 1

hardware:
  platform: lisy
  driverboards: lisy
  switches: lisy
  coils: lisy
  lights: lisy

modes:
  - base
  - attract
  - game
  - service_menu
  - self_test
  - adjustments
  - ruleset_selector
  - ruleset_original
  - ruleset_trident2020
  - ruleset_tournament
  - skill_shot
  - feeding_frenzy
  - sharp_shooter
  - explore_the_depths
  - deep_blue_sea

game:
  balls_per_game: (machine.balls_per_game_setting)
  max_players: 4

segment_displays:
  player1_score:
    number: 0
  player2_score:
    number: 1
  player3_score:
    number: 2
  player4_score:
    number: 3
  credits_display:
    number: 4
  ball_display:
    number: 5

