#config_version=6

mode:
  start_events: machine_reset_phase_3, game_ended
  stop_events: game_start
  priority: 10
  game_mode: false
  events_when_started: start_attract_mode
  events_when_stopped: stop_attract_mode

show_player:
  start_attract_mode:
    attract_radar_sweep:
      loops: 2
      events_when_completed: attract_next_center_out
    # Score displays: high score → blank → 00 on all four, forever
    attract_score_cycle:
      loops: -1
  attract_next_center_out:
    attract_center_out:
      loops: 2
      events_when_completed: attract_next_bottom_top
  attract_next_bottom_top:
    attract_bottom_to_top:
      loops: 2
      events_when_completed: attract_next_side_side
  attract_next_side_side:
    attract_side_to_side:
      loops: 2
      events_when_completed: attract_next_center_out

# The four player displays are driven by the attract_score_cycle show
# (high score → blank → 00); "GAME OVER" is the backbox lamp, not text.
segment_display_player:
  start_attract_mode:
    credits_display:
      text: "{machine.credits:02d}"
    ball_display:
      text: " "

variable_player:
  s_left_flipper_active{machine.current_ruleset < 3}:
    current_ruleset:
      int: machine.current_ruleset + 1
      action: set_machine
  s_left_flipper_active{machine.current_ruleset >= 3}:
    current_ruleset:
      int: 1
      action: set_machine
