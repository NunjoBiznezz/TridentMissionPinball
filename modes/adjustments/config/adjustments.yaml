  adj_chute_2_per_credit_off: adjustments_show_setting_14

  # --- Adjustment 15: Chute 3 Coins Per Credit ---
  s_service_active{machine.adj_setting == 15 and machine.adj_chute_3_per_credit == 0}: adj_chute_3_per_credit_on
  s_service_active{machine.adj_setting == 15 and machine.adj_chute_3_per_credit == 1}: adj_chute_3_per_credit_off
