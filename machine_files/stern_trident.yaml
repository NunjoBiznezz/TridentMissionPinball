# Memory drop targets: c_drop_target_reset raises the whole bank; the
# individual c_drop_target_N coils knock their target back DOWN. The game
# sets up a phase's target combination by firing the reset bar and then
# knocking down the targets that should not be standing (the ruleset posts
# the knockdown_dt_N events). Going through the device (rather than pulsing
# coils via coil_player) gets the ignore_switch_ms mute window, so a
# game-initiated knockdown does not look like a player hit.
drop_targets:
  dt_1:
    switch: s_drop_target_1
    knockdown_coil: c_drop_target_1
    knockdown_events: knockdown_dt_1
  dt_2:
    switch: s_drop_target_2
    knockdown_coil: c_drop_target_2
    knockdown_events: knockdown_dt_2
  dt_3:
    switch: s_drop_target_3
    knockdown_coil: c_drop_target_3
    knockdown_events: knockdown_dt_3
  dt_4:
    switch: s_drop_target_4
    knockdown_coil: c_drop_target_4
    knockdown_events: knockdown_dt_4
  dt_5:
    switch: s_drop_target_5
    knockdown_coil: c_drop_target_5
    knockdown_events: knockdown_dt_5

# The reset bar belongs to the bank, not the individual targets (one coil
# raises all five). Raised at boot and at the start of every ball; the
# ruleset raises it mid-game by posting raise_drop_targets, then knocks
# down targets to form the current phase combination.
drop_target_banks:
  dt_bank:
    drop_targets: dt_1, dt_2, dt_3, dt_4, dt_5
    reset_coil: c_drop_target_reset
    reset_events: machine_reset_phase_3, ball_starting, raise_drop_targets

ball_devices:
  bd_trough:
    ball_switches: s_outhole
    eject_coil: c_outhole
    tags: trough, home, drain
    eject_timeouts: 3s
    confirm_eject_type: target
    max_eject_attempts: 3

playfields:
  playfield:
    default_source_device: bd_trough
    tags: default

# Slings and bumpers go dead on tilt (the real tilt relay does this in
# hardware). The saucer kicker stays enabled so a captive ball can still
# be ejected and drain to end the tilted ball.
autofire_coils:
  ac_ul_sling:
    coil: c_ul_sling
    switch: s_ul_sling
    disable_events: ball_will_end, tilt
  ac_ur_sling:
    coil: c_ur_sling
    switch: s_ur_sling
    disable_events: ball_will_end, tilt
  ac_ll_sling:
    coil: c_ll_sling
    switch: s_ll_sling
    disable_events: ball_will_end, tilt
  ac_lr_sling:
    coil: c_lr_sling
    switch: s_lr_sling
    disable_events: ball_will_end, tilt
  ac_top_bumper:
    coil: c_top_bumper
    switch: s_top_bumper
    disable_events: ball_will_end, tilt
  ac_bottom_bumper:
    coil: c_bottom_bumper
    switch: s_bottom_bumper
    disable_events: ball_will_end, tilt
  ac_saucer:
    coil: c_saucer
    switch: s_saucer
