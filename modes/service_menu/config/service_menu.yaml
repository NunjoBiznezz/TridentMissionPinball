#config_version=6

# Service menu mode
#
# Entry:      press s_service (coin door switch, number 127) during attract
# Cycle value: press s_service to step the current setting forward
# Next setting: press s_start_button to advance to the next setting
# Exit:       pressing s_start_button past the last setting returns to attract
#
# ball_display      shows the current setting number (1, 2, 3 …)
# player1_score     shows the current setting value
#
# Settings (ordered by DIP switch number):
#   1 - High Score Feature   1=Extra Ball  2=Replay            (DIP 6)
#   2 - Balls Per Game       3 or 5                            (DIP 7)
#   3 - Melody Option        1=Full Melodies  2=2 Tones        (DIP 8)
#   4 - High Game to Date    1=Novelty  2=1FG  3=2FG  4=3FG   (DIP 15+16)
#   5 - Max Credits          5/10/15/20/25/30/35/40            (DIP 17+18+19)
#   6 - Credits in Attract   1=On  0=Off                       (DIP 20)
#   7 - Match Feature        1=On  0=Off                       (DIP 21)
#   8 - Extra Ball           1=On  0=Off                       (DIP 23)
#   9 - Outlane Special      1=On (2nd reset)  0=Off (3rd)     (DIP 24)
#  10 - Target Special       1=Limit 1/ball  0=No limit        (DIP 25)
#  11 - Outlane Special Limit 1=Limit 1/ball  0=No limit       (DIP 26)
#  12 - Extra Ball Alternation 1=Alternate  0=Constantly on    (DIP 27)
#  13 - Special Award         1=100K pts  2=Free ball  3=Free game  4=Free ball+game  (DIP 31+32)

mode:
  start_events: s_service_active
  stop_events: service_menu_exit
  priority: 50
  game_mode: false

event_player:
  # On entry, show setting 1 without changing its value.
  # service_menu_ready stays 0 until mode_service_menu_started fires,
  # preventing the entry press from also cycling the value.
  mode_service_menu_started: service_menu_show_setting_1

  # Setting 1: High Score Feature  (DIP 6)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 1 and machine.high_score_feature == 1}: high_score_feature_set_replay
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 1 and machine.high_score_feature == 2}: high_score_feature_set_extra_ball
  high_score_feature_set_extra_ball: service_menu_show_setting_1
  high_score_feature_set_replay: service_menu_show_setting_1

  # Setting 2: Balls Per Game  (DIP 7)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 2 and machine.balls_per_game_setting == 3}: balls_per_game_set_5
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 2 and machine.balls_per_game_setting == 5}: balls_per_game_set_3
  balls_per_game_set_3: service_menu_show_setting_2
  balls_per_game_set_5: service_menu_show_setting_2

  # Setting 3: Melody Option  (DIP 8)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 3 and machine.melody_option == 1}: melody_option_set_2
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 3 and machine.melody_option == 2}: melody_option_set_1
  melody_option_set_1: service_menu_show_setting_3
  melody_option_set_2: service_menu_show_setting_3

  # Setting 4: High Game to Date  (DIP 15+16)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 4 and machine.high_game_to_date == 1}: high_game_set_2
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 4 and machine.high_game_to_date == 2}: high_game_set_3
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 4 and machine.high_game_to_date == 3}: high_game_set_4
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 4 and machine.high_game_to_date == 4}: high_game_set_1
  high_game_set_1: service_menu_show_setting_4
  high_game_set_2: service_menu_show_setting_4
  high_game_set_3: service_menu_show_setting_4
  high_game_set_4: service_menu_show_setting_4

  # Setting 5: Max Credits  (DIP 17+18+19)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 5 and machine.max_credits == 5}: max_credits_set_10
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 5 and machine.max_credits == 10}: max_credits_set_15
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 5 and machine.max_credits == 15}: max_credits_set_20
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 5 and machine.max_credits == 20}: max_credits_set_25
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 5 and machine.max_credits == 25}: max_credits_set_30
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 5 and machine.max_credits == 30}: max_credits_set_35
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 5 and machine.max_credits == 35}: max_credits_set_40
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 5 and machine.max_credits == 40}: max_credits_set_5
  max_credits_set_5: service_menu_show_setting_5
  max_credits_set_10: service_menu_show_setting_5
  max_credits_set_15: service_menu_show_setting_5
  max_credits_set_20: service_menu_show_setting_5
  max_credits_set_25: service_menu_show_setting_5
  max_credits_set_30: service_menu_show_setting_5
  max_credits_set_35: service_menu_show_setting_5
  max_credits_set_40: service_menu_show_setting_5

  # Setting 6: Credits in Attract  (DIP 20)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 6 and machine.display_credits_attract == 1}: credits_attract_set_off
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 6 and machine.display_credits_attract == 0}: credits_attract_set_on
  credits_attract_set_on: service_menu_show_setting_6
  credits_attract_set_off: service_menu_show_setting_6

  # Setting 7: Match Feature  (DIP 21)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 7 and machine.match_feature == 1}: match_feature_set_off
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 7 and machine.match_feature == 0}: match_feature_set_on
  match_feature_set_on: service_menu_show_setting_7
  match_feature_set_off: service_menu_show_setting_7

  # Setting 8: Extra Ball  (DIP 23)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 8 and machine.extra_ball_enabled == 1}: extra_ball_set_off
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 8 and machine.extra_ball_enabled == 0}: extra_ball_set_on
  extra_ball_set_on: service_menu_show_setting_8
  extra_ball_set_off: service_menu_show_setting_8

  # Setting 9: Outlane Special  (DIP 24)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 9 and machine.outlane_special_setting == 1}: outlane_special_set_off
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 9 and machine.outlane_special_setting == 0}: outlane_special_set_on
  outlane_special_set_on: service_menu_show_setting_9
  outlane_special_set_off: service_menu_show_setting_9

  # Setting 10: Target Special  (DIP 25)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 10 and machine.target_special_limit == 1}: target_special_set_off
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 10 and machine.target_special_limit == 0}: target_special_set_on
  target_special_set_on: service_menu_show_setting_10
  target_special_set_off: service_menu_show_setting_10

  # Setting 11: Outlane Special Limit  (DIP 26)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 11 and machine.outlane_special_limit == 1}: outlane_special_limit_set_off
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 11 and machine.outlane_special_limit == 0}: outlane_special_limit_set_on
  outlane_special_limit_set_on: service_menu_show_setting_11
  outlane_special_limit_set_off: service_menu_show_setting_11

  # Setting 12: Extra Ball Alternation  (DIP 27)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 12 and machine.extra_ball_alternation == 1}: extra_ball_alt_set_off
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 12 and machine.extra_ball_alternation == 0}: extra_ball_alt_set_on
  extra_ball_alt_set_on: service_menu_show_setting_12
  extra_ball_alt_set_off: service_menu_show_setting_12

  # Setting 13: Special Award  (DIP 31+32)
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 13 and machine.special_award_setting == 1}: special_award_set_2
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 13 and machine.special_award_setting == 2}: special_award_set_3
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 13 and machine.special_award_setting == 3}: special_award_set_4
  s_service_active{machine.service_menu_ready == 1 and machine.service_setting == 13 and machine.special_award_setting == 4}: special_award_set_1
  special_award_set_1: service_menu_show_setting_13
  special_award_set_2: service_menu_show_setting_13
  special_award_set_3: service_menu_show_setting_13
  special_award_set_4: service_menu_show_setting_13

  # s_start_button advances through settings; exit after the last one
  s_start_button_active{machine.service_setting == 1}: service_menu_advance_to_2
  service_menu_advance_to_2: service_menu_show_setting_2
  s_start_button_active{machine.service_setting == 2}: service_menu_advance_to_3
  service_menu_advance_to_3: service_menu_show_setting_3
  s_start_button_active{machine.service_setting == 3}: service_menu_advance_to_4
  service_menu_advance_to_4: service_menu_show_setting_4
  s_start_button_active{machine.service_setting == 4}: service_menu_advance_to_5
  service_menu_advance_to_5: service_menu_show_setting_5
  s_start_button_active{machine.service_setting == 5}: service_menu_advance_to_6
  service_menu_advance_to_6: service_menu_show_setting_6
  s_start_button_active{machine.service_setting == 6}: service_menu_advance_to_7
  service_menu_advance_to_7: service_menu_show_setting_7
  s_start_button_active{machine.service_setting == 7}: service_menu_advance_to_8
  service_menu_advance_to_8: service_menu_show_setting_8
  s_start_button_active{machine.service_setting == 8}: service_menu_advance_to_9
  service_menu_advance_to_9: service_menu_show_setting_9
  s_start_button_active{machine.service_setting == 9}: service_menu_advance_to_10
  service_menu_advance_to_10: service_menu_show_setting_10
  s_start_button_active{machine.service_setting == 10}: service_menu_advance_to_11
  service_menu_advance_to_11: service_menu_show_setting_11
  s_start_button_active{machine.service_setting == 11}: service_menu_advance_to_12
  service_menu_advance_to_12: service_menu_show_setting_12
  s_start_button_active{machine.service_setting == 12}: service_menu_advance_to_13
  service_menu_advance_to_13: service_menu_show_setting_13
  s_start_button_active{machine.service_setting == 13}: service_menu_exit

