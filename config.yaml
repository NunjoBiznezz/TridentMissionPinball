#config_version=6

mpf:
  default_platform_hz: 1000

machine:
  balls_installed: 3
  min_balls: 1

hardware:
  platform: lisy
  driverboards: lisy
  accelerometer: none
  servo_controller: none
  i2c: none
  switches: lisy
  coils: lisy
  lights: lisy
  dmd: lisy

lisy:
  connection: network
  port: /dev/ttyUSB0
  baud: 115200
  flow_control: none
  network_interface: 127.0.0.1
  network_port: 5963
  debug: true
  platform: stern
  hw_rule_coil_delay: 50ms

displays:
  window:
    width: 800
    height: 600
    title: Stern Trident
    resizable: true
    fullscreen: false
    borderless: false
  dmd:
    width: 128
    height: 32
    default: true

window:
  width: 1024
  height: 768
  title: Mission Pinball Framework
  resizable: true
  fullscreen: false
  borderless: false

modes:
  - base
  - attract
  - game
  - service_menu
  - self_test
  - adjustments
  - ruleset_selector
  - ruleset_original
  - ruleset_trident2020
  - ruleset_tournament

game:
  balls_per_game: (machine.balls_per_game_setting)
  max_players: 4

segment_displays:
  player1_score:
    number: 0
  player2_score:
    number: 1
  player3_score:
    number: 2
  player4_score:
    number: 3
  credits_display:
    number: 4
  ball_display:
    number: 5

machine_vars:
  current_ruleset:
    initial_value: 1
    value_type: int
    persist: true
  high_score_feature:
