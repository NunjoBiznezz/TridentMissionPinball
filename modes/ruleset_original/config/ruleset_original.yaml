#config_version=6

# Rule set 1: Original Stern Trident (1979) rules

mode:
  # Started fresh for EVERY ball: the selector posts ruleset_*_selected on
  # each ball_started, and like all game modes this one stops at ball end.
  # The per-ball restart is what resets all features between balls — the
  # mode_ruleset_original_started init below runs at every ball start.
  start_events: ruleset_original_selected, ruleset_trident2020_selected
  stop_events: game_ending
  priority: 210

# Phase-specific drop target banks.
# reset_on_complete is not set so targets are only raised by explicit coil_player events.
# Completion events are conditioned on current drop_phase so overlapping banks
# (e.g. phase_a fires when dt_2 and dt_4 are down regardless of phase) do not
# cause false phase transitions.
drop_target_banks:
  phase_a:
    drop_targets: dt_2, dt_4
  phase_b:
    drop_targets: dt_1, dt_3, dt_5
  phase_c:
    drop_targets: dt_1, dt_2, dt_4, dt_5
  phase_de:
    drop_targets: dt_1, dt_2, dt_3, dt_4, dt_5

accruals:
  standup_targets:
    events:
      - s_standup_white_active
      - s_standup_green_active
      - s_standup_amber_active
      - s_standup_yellow_active
      - s_standup_purple_active
    events_when_complete: standup_all_hit
    reset_on_complete: true
    disable_on_complete: false
    reset_events: ball_drain, mode_ruleset_original_started
    start_enabled: true

extra_balls:
  drop_target_special:
    award_events: special_award_extra_ball
  standup_extra_ball:
    award_events: collect_standup_extra_ball

# End-of-ball bonus countdown: hold the ball_ending queue until the
# count (including multiplier repeats) finishes. Tilted balls skip it.
queue_relay_player:
  ball_ending{not game.tilted}:
    post: bonus_countdown_start
    wait_for: bonus_countdown_complete

timers:
  bonus_count:
    start_value: 0
    direction: up
    tick_interval: 150ms
    control_events:
      - event: bonus_countdown_start
        action: restart
      - event: bonus_countdown_complete
        action: stop

sound_player:
  # Original Stern sound board behavior: sounds are tied to the POINTS
  # awarded, not to specific switches. Every score change plays the sound
  # for its magnitude — 10-point awards play 100_TenPoint, hundreds play
  # 101, thousands 102, ten-thousands and up 103. This automatically
  # covers every switch, every award, and the end-of-ball bonus countdown
  # (each counted 1,000 plays the thousand-point sound).
  player_score{change == 10}: 100_TenPoint
  player_score{change >= 100 and change < 1000}: 101_OneHundredPoint
  player_score{change >= 1000 and change < 10000}: 102_OneThousandPoint
  player_score{change >= 10000}: 103_TenThousandPoint

  # Free Game special award: same chime as coin insertion (it's a credit award).
  special_award_free_game_credited: 013_AddCredit

coil_player:
  # Free Game special award: knocker thunk, matching the classic replay award.
  special_award_free_game_credited:
    c_knocker: pulse

event_player:
  # Bonus countdown ticks: count a step while any remain; at zero either
  # restart the count (multiplier repeats left) or finish.
  timer_bonus_count_tick{current_player.bonus_steps > 0}: bonus_count_step
  timer_bonus_count_tick{current_player.bonus_steps == 0 and current_player.bonus_repeats_left > 1}: bonus_count_restart
  timer_bonus_count_tick{current_player.bonus_steps == 0 and current_player.bonus_repeats_left <= 1}: bonus_countdown_complete

  # Phase completions — only act when in the matching phase.
  # The completion is posted with a 100ms delay so that every bank _down
  # event from the same ball hit is evaluated against the OLD drop_phase
  # before variable_player advances it. Without the delay, completing
  # Phase C (which leaves all 5 targets physically down because target 3
  # was game-knocked) also fires the all-5 phase_de bank in the same burst,
  # and once drop_phase flips to 4 mid-burst it would falsely complete
  # Phase D as well.
  drop_target_bank_phase_a_down{current_player.drop_phase == 1}: dt_phase_a_complete|100ms
  drop_target_bank_phase_b_down{current_player.drop_phase == 2}: dt_phase_b_complete|100ms
  drop_target_bank_phase_c_down{current_player.drop_phase == 3}: dt_phase_c_complete|100ms
  drop_target_bank_phase_de_down{current_player.drop_phase == 4}: dt_phase_d_complete|100ms
  drop_target_bank_phase_de_down{current_player.drop_phase == 5}: dt_phase_e_complete|100ms

  # Saucer hit during Phase E resets progression to Phase A (5X bonus stays earned)
  s_saucer_active{current_player.drop_phase == 5}: phase_e_saucer_reset

  # Drop target repositioning, like the real hardware does it: raise the
  # whole bank with the reset bar, then 400ms later (once the bar has
  # released) knock back down every target that is not part of the current
  # phase's standing combination. raise_drop_targets fires dt_bank's reset
  # coil and knockdown_dt_N each target's knockdown coil (machine config) —
  # going through the devices mutes the switches so the game's own coil
  # fire never looks like a player hit (no skill shot / scoring triggers).
  #
  # The mode (re)starts on every ball, so mode_ruleset_original_started
  # fires each ball start: dt_bank has already raised on ball_starting,
  # and the delayed positioning below sets the phase combination.
  # Phase transitions reposition immediately; drop_phase is already updated
  # by variable_player, and the conditions below are evaluated when the
  # delayed event fires.
  mode_ruleset_original_started: position_drop_targets|400ms
  dt_phase_a_complete: raise_drop_targets, position_drop_targets|400ms
  dt_phase_b_complete: raise_drop_targets, position_drop_targets|400ms
  dt_phase_c_complete: raise_drop_targets, position_drop_targets|400ms
  dt_phase_d_complete: raise_drop_targets, position_drop_targets|400ms
  dt_phase_e_complete: raise_drop_targets, position_drop_targets|400ms
  phase_e_saucer_reset: raise_drop_targets, position_drop_targets|400ms

  # Phase combinations: A = 2 & 4 standing, B = 1-3-5, C = 1-2-4-5,
  # D and E = all 5 standing (nothing to knock down).
  position_drop_targets{current_player.drop_phase == 1}: knockdown_dt_1, knockdown_dt_3, knockdown_dt_5
  position_drop_targets{current_player.drop_phase == 2}: knockdown_dt_2, knockdown_dt_4
  position_drop_targets{current_player.drop_phase == 3}: knockdown_dt_3

  # Outlane special: lit after 2nd target reset (setting=1) or 3rd target reset (setting=0)
  dt_phase_b_complete{machine.outlane_special_setting == 1}: outlane_special_earned
  dt_phase_c_complete{machine.outlane_special_setting == 0}: outlane_special_earned

  # Special award dispatch  1=100K pts  2=Free ball  3=Free game  4=Free ball+game
  dt_phase_e_complete{machine.special_award_setting == 1}: special_award_points
  dt_phase_e_complete{(machine.special_award_setting == 2 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 0}: special_award_extra_ball
  dt_phase_e_complete{(machine.special_award_setting == 2 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 1}: tournament_extra_ball_score
  dt_phase_e_complete{(machine.special_award_setting == 3 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 0}: special_award_free_game
  dt_phase_e_complete{(machine.special_award_setting == 3 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 1}: tournament_special_award_score

  # Free Game special award: add a credit (capped, like coin insertion) and
  # fire the knocker + credit chime together. Silent no-op if already maxed.
  special_award_free_game{machine.credits < machine.max_credits}: special_award_free_game_credited

  # All 5 standup targets hit
  standup_all_hit{current_player.standup_completions == 0}: standup_first_complete
  standup_all_hit{current_player.standup_completions == 1}: standup_second_complete

  # Second standup completion awards the special directly (the lit
  # l_standup_special announced it after the first completion).
  # Same award dispatch as the other specials:
  # 1=100K pts  2=Free ball  3=Free game  4=Free ball+game
  standup_second_complete{machine.special_award_setting == 1}: special_award_points
  standup_second_complete{(machine.special_award_setting == 2 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 0}: special_award_extra_ball
  standup_second_complete{(machine.special_award_setting == 2 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 1}: tournament_extra_ball_score
  standup_second_complete{(machine.special_award_setting == 3 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 0}: special_award_free_game
  standup_second_complete{(machine.special_award_setting == 3 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 1}: tournament_special_award_score

  # Right inlane collects extra ball when lit (or scores points in tournament mode)
  s_right_return_lane_active{current_player.extra_ball_lit == 1 and machine.adj_tournament_scoring == 0}: collect_standup_extra_ball
  s_right_return_lane_active{current_player.extra_ball_lit == 1 and machine.adj_tournament_scoring == 1}: tournament_extra_ball_collect

  # Right outlane collects right special when lit
  s_right_outlane_active{current_player.right_special_lit == 1}: right_special_awarded

  # Right special dispatches same award as drop target special
  right_special_awarded{machine.special_award_setting == 1}: special_award_points
  right_special_awarded{(machine.special_award_setting == 2 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 0}: special_award_extra_ball
  right_special_awarded{(machine.special_award_setting == 2 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 1}: tournament_extra_ball_score
  right_special_awarded{(machine.special_award_setting == 3 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 0}: special_award_free_game
  right_special_awarded{(machine.special_award_setting == 3 or machine.special_award_setting == 4) and machine.adj_tournament_scoring == 1}: tournament_special_award_score

  # Upper left rollover: advance left lane award (caps at 8,000)
  s_rollover_active{current_player.left_lane_value == 2000}: advance_lane_to_4k
  s_rollover_active{current_player.left_lane_value == 4000}: advance_lane_to_6k
  s_rollover_active{current_player.left_lane_value == 6000}: advance_lane_to_8k

  # Upper slings: score + bonus advance via common event
  s_ul_sling_active: upper_sling_hit
  s_ur_sling_active: upper_sling_hit

  # Lower slings: score only
  s_ll_sling_active: lower_sling_hit
  s_lr_sling_active: lower_sling_hit

  # Pop bumpers: score via common event
  s_top_bumper_active: pop_bumper_hit
  s_bottom_bumper_active: pop_bumper_hit

  # Upper and lower slings and 10 pt switch move purple bonus to opposite spinner
  s_ul_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 1}: purple_to_right
  s_ul_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 0}: purple_to_left
  s_ur_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 1}: purple_to_right
  s_ur_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 0}: purple_to_left
  s_ll_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 1}: purple_to_right
  s_ll_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 0}: purple_to_left
  s_lr_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 1}: purple_to_right
  s_lr_sling_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 0}: purple_to_left

  # 10 point and change switches: same effect as slings, but only if purple bonus is active (otherwise they just score 10 points with no bonus advance, so no need to swap).
  s_10_pts_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 1}: purple_to_right
  s_10_pts_active{current_player.purple_bonus > 0 and current_player.purple_on_left == 0}: purple_to_left

variable_player:
  # Initialize on mode start
  mode_ruleset_original_started:
    drop_phase:
      int: 1
      action: set
    saucer_value:
      int: 5000
      action: set
    bonus_multiplier:
      int: 1
      action: set
    left_lane_value:
      int: 2000
      action: set
    left_spinner_value:
      int: 200
      action: set
    right_spinner_value:
      int: 200
      action: set
    purple_bonus:
      int: 0
      action: set
    purple_on_left:
      int: 1
      action: set
    white_applied:
      int: 0
      action: set
    amber_applied:
      int: 0
      action: set
    green_applied:
      int: 0
      action: set
    yellow_applied:
      int: 0
      action: set
    purple_applied:
      int: 0
      action: set
    standup_completions:
      int: 0
      action: set
    extra_ball_lit:
      int: 0
      action: set
    right_special_lit:
      int: 0
      action: set
    bonus_steps:
      int: 1
      action: set

  # Phase A complete: earn 2X, saucer advances to 10,000
  dt_phase_a_complete:
    drop_phase:
      int: 2
      action: set
    bonus_multiplier:
      int: 2
      action: set
    saucer_value:
      int: 10000
      action: set

  # Phase B complete: earn 3X, saucer advances to 20,000
  dt_phase_b_complete:
    drop_phase:
      int: 3
      action: set
    bonus_multiplier:
      int: 3
      action: set
    saucer_value:
      int: 20000
      action: set

  # Phase C complete: earn 4X, saucer advances to 30,000 (maximum)
  dt_phase_c_complete:
    drop_phase:
      int: 4
      action: set
    bonus_multiplier:
      int: 4
      action: set
    saucer_value:
      int: 30000
      action: set

  # Phase D complete: earn 5X
  dt_phase_d_complete:
    drop_phase:
      int: 5
      action: set
    bonus_multiplier:
      int: 5
      action: set

  # Saucer always scores its current award value
  s_saucer_active:
    score: current_player.saucer_value

  # Special award: 100,000 points option
  special_award_points:
    score: 100000

  # Special award: Free Game option — add a credit (see coil_player/sound_player
  # for the matching knocker thunk and credit chime).
  special_award_free_game_credited:
    credits:
      int: 1
      action: add_machine

  # Tournament mode: score points instead of awarding extra ball
  tournament_extra_ball_score:
    score: machine.adj_extra_ball_award
  tournament_extra_ball_collect:
    score: machine.adj_extra_ball_award
    extra_ball_lit:
      int: 0

  # Tournament mode: score points instead of awarding a free game credit
  tournament_special_award_score:
    score: machine.adj_special_award

  # Phase E saucer reset: return to Phase A, saucer resets to 5,000
  # Earned multiplier lamps and bonus_multiplier are preserved intentionally
  phase_e_saucer_reset:
    drop_phase:
      int: 1
      action: set
    saucer_value:
      int: 5000
      action: set

  # Drop targets: 500 points per target knocked down by the player.
  # Game-initiated knockdowns (phase positioning for phases with 2, 3 and
  # 4 standing targets) go through the device's knockdown coil, which
  # mutes the switch — no s_drop_target_N_active event posts, so they
  # score nothing.
  s_drop_target_1_active:
    score: 500
  s_drop_target_2_active:
    score: 500
  s_drop_target_3_active:
    score: 500
  s_drop_target_4_active:
    score: 500
  s_drop_target_5_active:
    score: 500

  # Lower slingshots: 10 points flat
  lower_sling_hit:
    score: 10

  # Pop bumpers: 1,000 on 3-ball game; 100 on 5-ball game
  pop_bumper_hit{machine.balls_per_game_setting == 3}:
    score: 1000
  pop_bumper_hit{machine.balls_per_game_setting == 5}:
    score: 100

  # 10 point switch (also swaps the purple lane — see event_player)
  s_10_pts_active:
    score: 10

  # Upper left rollover: 100 points
  s_rollover_active:
    score: 100

  # Left lane advance steps
  advance_lane_to_4k:
    left_lane_value:
      int: 4000
      action: set
  advance_lane_to_6k:
    left_lane_value:
      int: 6000
      action: set
  advance_lane_to_8k:
    left_lane_value:
      int: 8000
      action: set

  # Lower left return lane scores current award value
  s_left_return_lane_active:
    score: current_player.left_lane_value

  # Bonus advance: each chime event scores 1,000 and advances the counter.
  # Shows (bonus_advance_1k/3k) post this event 1–3 times at 150ms intervals.
  bonus_chime_1k:
    score: 1000
  bonus_chime_1k{current_player.bonus_steps < 19}:
    bonus_steps: {int: 1, action: add}

  # Standup target completions
  standup_first_complete:
    standup_completions:
      int: 1
      action: set
    extra_ball_lit:
      int: 1
      action: set
  # Second completion: the special is awarded immediately (event_player
  # dispatch above) — nothing is lit for later collection.
  standup_second_complete:
    standup_completions:
      int: 2
      action: set
  outlane_special_earned:
    right_special_lit:
      int: 1
      action: set
  collect_standup_extra_ball:
    extra_ball_lit:
      int: 0
      action: set
  # right_special_awarded intentionally does NOT clear right_special_lit:
  # once earned, the outlane special (and its lamp) stay lit for the rest
  # of the ball and award again on another lit outlane drain.

  # Standup targets: 1000 points every hit; spinner increase only on first hit per ball
  s_standup_white_active:
    score: 1000
  s_standup_white_active{current_player.white_applied == 0}:
    left_spinner_value:
      int: 400
      action: add
    white_applied:
      int: 1
      action: set
  s_standup_amber_active:
    score: 1000
  s_standup_amber_active{current_player.amber_applied == 0}:
    left_spinner_value:
      int: 400
      action: add
    amber_applied:
      int: 1
      action: set
  s_standup_green_active:
    score: 1000
  s_standup_green_active{current_player.green_applied == 0}:
    right_spinner_value:
      int: 400
      action: add
    green_applied:
      int: 1
      action: set
  s_standup_yellow_active:
    score: 1000
  s_standup_yellow_active{current_player.yellow_applied == 0}:
    right_spinner_value:
      int: 400
      action: add
    yellow_applied:
      int: 1
      action: set
  # Purple always moves bonus to left; value increase only on first hit
  s_standup_purple_active:
    score: 1000
    purple_on_left:
      int: 1
      action: set
  s_standup_purple_active{current_player.purple_applied == 0}:
    purple_bonus:
      int: 1000
      action: add
    purple_applied:
      int: 1
      action: set

  # Spinner scoring: suppressed during Feeding Frenzy (ff_active == 1) which scores 5K flat
  s_left_spinner_active{current_player.ff_active == 0}:
    score: current_player.left_spinner_value
  s_left_spinner_active{current_player.purple_on_left == 1 and current_player.ff_active == 0}:
    score: current_player.purple_bonus
  s_right_spinner_active{current_player.ff_active == 0}:
    score: current_player.right_spinner_value
  s_right_spinner_active{current_player.purple_on_left == 0 and current_player.ff_active == 0}:
    score: current_player.purple_bonus

  # Purple bonus side swaps
  purple_to_right:
    purple_on_left:
      int: 0
      action: set
  purple_to_left:
    purple_on_left:
      int: 1
      action: set

  # ── End-of-ball bonus countdown ───────────────────────────────────────
  # The queue_relay_player below holds ball_ending while the bonus_count
  # timer ticks the bonus down to zero, scoring 1,000 and stepping the
  # lamps (value-driven, above) per tick. When the count reaches zero and
  # a multiplier is earned, the count restarts from the saved value: 2X
  # counts twice, 3X three times, 5X five times (max 5 × 19,000).
  # bonus_steps and bonus_multiplier reset at ball_started — NOT at
  # ball_drain — because the countdown runs after the drain. Tilted balls
  # skip the countdown entirely (no relay, no award).
  bonus_countdown_start:
    bonus_steps_saved:
      int: current_player.bonus_steps
      action: set
    bonus_repeats_left:
      int: current_player.bonus_multiplier
      action: set
  bonus_count_step:
    score: 1000
    bonus_steps:
      int: -1
      action: add
  bonus_count_restart:
    bonus_repeats_left:
      int: -1
      action: add
    bonus_steps:
      int: current_player.bonus_steps_saved
      action: set

  # (bonus_steps and bonus_multiplier re-initialize with the mode itself
  # at every ball start — see the mode_ruleset_original_started block.)

  # Ball drain: reset all per-ball state to initial values (bonus vars
  # excepted — see countdown above)
  ball_drain:
    drop_phase:
      int: 1
      action: set
    saucer_value:
      int: 5000
      action: set
    left_lane_value:
      int: 2000
      action: set
    left_spinner_value:
      int: 200
      action: set
    right_spinner_value:
      int: 200
      action: set
    purple_bonus:
      int: 0
      action: set
    purple_on_left:
      int: 1
      action: set
    white_applied:
      int: 0
      action: set
    amber_applied:
      int: 0
      action: set
    green_applied:
      int: 0
      action: set
    yellow_applied:
      int: 0
      action: set
    purple_applied:
      int: 0
      action: set
    standup_completions:
      int: 0
      action: set
    extra_ball_lit:
      int: 0
      action: set
    right_special_lit:
      int: 0
      action: set

show_player:
  # Bonus advance: one chime per 1,000-point step, staggered 150ms apart.
  # Each bonus_chime_1k event scores 1,000 and advances the counter by 1.
  # Right inlane fires the 3-chime show; left inlane and upper slings fire the 1-chime show.
  s_right_return_lane_active:
    bonus_advance_3k:
      loops: 0
  s_left_return_lane_active:
    bonus_advance_1k:
      loops: 0
  upper_sling_hit:
    bonus_advance_1k:
      loops: 0

light_player:
  # Game start state
  mode_ruleset_original_started:
    l_bonus_2x_feature: on
    l_bonus_3x_feature: off
    l_bonus_4x_feature: off
    l_bonus_5x_feature: off
    l_bonus_2x: off
    l_bonus_3x: off
    l_bonus_4x: off
    l_bonus_5x: off
    l_top_eject_5k: on
    l_top_eject_10k: off
    l_top_eject_20k: off
    l_top_eject_30k: off
    l_drop_target_special: off
    l_left_lane_2k: on
    l_left_lane_4k: off
    l_left_lane_6k: off
    l_left_lane_8k: off
    l_left_spinner_white: off
    l_left_spinner_amber: off
    l_left_spinner_purple: off
    l_right_spinner_green: off
    l_right_spinner_yellow: off
    l_right_spinner_purple: off
    l_extra_ball: off
    l_right_outlane_special: off
    l_standup_special: off
    l_bonus_1: on
    l_bonus_2: off
    l_bonus_3: off
    l_bonus_4: off
    l_bonus_5: off
    l_bonus_6: off
    l_bonus_7: off
    l_bonus_8: off
    l_bonus_9: off
    l_bonus_10: off
    l_standup_white: off
    l_standup_amber: off
    l_standup_green: off
    l_standup_yellow: off
    l_standup_purple: off

  # Phase A complete: 2X earned, 3X feature lit, saucer 10K
  dt_phase_a_complete:
    l_bonus_2x: on
    l_bonus_2x_feature: off
    l_bonus_3x_feature: on
    l_top_eject_5k: off
    l_top_eject_10k: on

  # Phase B complete: 3X earned, 4X feature lit, saucer 20K
  dt_phase_b_complete:
    l_bonus_3x: on
    l_bonus_3x_feature: off
    l_bonus_4x_feature: on
    l_top_eject_10k: off
    l_top_eject_20k: on

  # Phase C complete: 4X earned, 5X feature lit, saucer 30K
  dt_phase_c_complete:
    l_bonus_4x: on
    l_bonus_4x_feature: off
    l_bonus_5x_feature: on
    l_top_eject_20k: off
    l_top_eject_30k: on

  # Phase D complete: 5X earned, special mode begins
  dt_phase_d_complete:
    l_bonus_5x: on
    l_bonus_5x_feature: off
    l_drop_target_special: on

  # Left lane advance lamps
  advance_lane_to_4k:
    l_left_lane_2k: off
    l_left_lane_4k: on
  advance_lane_to_6k:
    l_left_lane_4k: off
    l_left_lane_6k: on
  advance_lane_to_8k:
    l_left_lane_6k: off
    l_left_lane_8k: on

  # Ball drain: reset lamps to initial Phase A state. The bonus counter
  # lamps (l_bonus_1..10) are NOT touched here — they keep displaying
  # bonus_steps through the end-of-ball countdown and reset with the
  # variable at ball_started.
  ball_drain:
    l_bonus_2x_feature: on
    l_bonus_3x_feature: off
    l_bonus_4x_feature: off
    l_bonus_5x_feature: off
    l_bonus_2x: off
    l_bonus_3x: off
    l_bonus_4x: off
    l_bonus_5x: off
    l_top_eject_5k: on
    l_top_eject_10k: off
    l_top_eject_20k: off
    l_top_eject_30k: off
    l_drop_target_special: off
    l_left_lane_2k: on
    l_left_lane_4k: off
    l_left_lane_6k: off
    l_left_lane_8k: off
    l_left_spinner_white: off
    l_left_spinner_amber: off
    l_left_spinner_purple: off
    l_right_spinner_green: off
    l_right_spinner_yellow: off
    l_right_spinner_purple: off
    l_extra_ball: off
    l_right_outlane_special: off
    l_standup_special: off
    l_standup_white: off
    l_standup_amber: off
    l_standup_green: off
    l_standup_yellow: off
    l_standup_purple: off

  # Bonus counter lamps, driven by the bonus_steps value itself so the
  # full lamp state is correct after any change. Exactly ONE of the
  # 1K-9K lamps is lit — the units digit of the bonus — and the 10K
  # lamp lights for 10 and above: 11,000 = l_bonus_1 + l_bonus_10.
  # At exactly 10, only the 10K lamp is lit. Hard cap is 19.
  player_bonus_steps{value >= 10}:
    l_bonus_10: on
  player_bonus_steps{value < 10}:
    l_bonus_10: off
  player_bonus_steps{value == 1 or value == 11}:
    l_bonus_1: on
  player_bonus_steps{value != 1 and value != 11}:
    l_bonus_1: off
  player_bonus_steps{value == 2 or value == 12}:
    l_bonus_2: on
  player_bonus_steps{value != 2 and value != 12}:
    l_bonus_2: off
  player_bonus_steps{value == 3 or value == 13}:
    l_bonus_3: on
  player_bonus_steps{value != 3 and value != 13}:
    l_bonus_3: off
  player_bonus_steps{value == 4 or value == 14}:
    l_bonus_4: on
  player_bonus_steps{value != 4 and value != 14}:
    l_bonus_4: off
  player_bonus_steps{value == 5 or value == 15}:
    l_bonus_5: on
  player_bonus_steps{value != 5 and value != 15}:
    l_bonus_5: off
  player_bonus_steps{value == 6 or value == 16}:
    l_bonus_6: on
  player_bonus_steps{value != 6 and value != 16}:
    l_bonus_6: off
  player_bonus_steps{value == 7 or value == 17}:
    l_bonus_7: on
  player_bonus_steps{value != 7 and value != 17}:
    l_bonus_7: off
  player_bonus_steps{value == 8 or value == 18}:
    l_bonus_8: on
  player_bonus_steps{value != 8 and value != 18}:
    l_bonus_8: off
  player_bonus_steps{value == 9 or value == 19}:
    l_bonus_9: on
  player_bonus_steps{value != 9 and value != 19}:
    l_bonus_9: off

  # Outlane special lit by drop target phase
  outlane_special_earned:
    l_right_outlane_special: on

  # Standup target completions
  # First completion: extra ball collectable at the right return lane,
  # and the standup special lamp announces the next completion's award.
  standup_first_complete:
    l_extra_ball: on
    l_standup_special: on
  # Second completion: special awarded immediately, lamp goes out.
  standup_second_complete:
    l_standup_special: off
  collect_standup_extra_ball:
    l_extra_ball: off
  tournament_extra_ball_collect:
    l_extra_ball: off
  # l_right_outlane_special is not cleared on award — it stays lit for the
  # remainder of the ball and resets with everything else at ball_drain.

  # Standup targets light their respective spinner lamp and standup lamp
  s_standup_white_active:
    l_left_spinner_white: on
    l_standup_white: on
  s_standup_amber_active:
    l_left_spinner_amber: on
    l_standup_amber: on
  s_standup_green_active:
    l_right_spinner_green: on
    l_standup_green: on
  s_standup_yellow_active:
    l_right_spinner_yellow: on
    l_standup_yellow: on
  s_standup_purple_active:
    l_left_spinner_purple: on
    l_right_spinner_purple: off
    l_standup_purple: on

  # All 5 standup targets hit: turn off standup lamps for next cycle
  standup_all_hit:
    l_standup_white: off
    l_standup_amber: off
    l_standup_green: off
    l_standup_yellow: off
    l_standup_purple: off

  # Drop target lamps show which targets need to be hit. They are set as a
  # group when the phase combination is positioned (not from the mechanical
  # raise, which would flash all 5 during the reset bar stroke), and each
  # lamp goes out when its target is knocked down.
  position_drop_targets{current_player.drop_phase == 1}:
    l_drop_target_1: off
    l_drop_target_2: on
    l_drop_target_3: off
    l_drop_target_4: on
    l_drop_target_5: off
  position_drop_targets{current_player.drop_phase == 2}:
    l_drop_target_1: on
    l_drop_target_2: off
    l_drop_target_3: on
    l_drop_target_4: off
    l_drop_target_5: on
  position_drop_targets{current_player.drop_phase == 3}:
    l_drop_target_1: on
    l_drop_target_2: on
    l_drop_target_3: off
    l_drop_target_4: on
    l_drop_target_5: on
  position_drop_targets{current_player.drop_phase == 4}:
    l_drop_target_1: on
    l_drop_target_2: on
    l_drop_target_3: on
    l_drop_target_4: on
    l_drop_target_5: on
  position_drop_targets{current_player.drop_phase == 5}:
    l_drop_target_1: on
    l_drop_target_2: on
    l_drop_target_3: on
    l_drop_target_4: on
    l_drop_target_5: on
  drop_target_dt_1_down:
    l_drop_target_1: off
  drop_target_dt_2_down:
    l_drop_target_2: off
  drop_target_dt_3_down:
    l_drop_target_3: off
  drop_target_dt_4_down:
    l_drop_target_4: off
  drop_target_dt_5_down:
    l_drop_target_5: off

  # Purple bonus lamp follows the side it's on
  purple_to_right:
    l_left_spinner_purple: off
    l_right_spinner_purple: on
  purple_to_left:
    l_right_spinner_purple: off
    l_left_spinner_purple: on

  # Phase E saucer reset: return to Phase A lamp state
  # Earned multiplier lamps (l_bonus_2x through l_bonus_5x) are intentionally
  # NOT turned off — the 5X (and all earned multipliers) remain lit
  phase_e_saucer_reset:
    l_bonus_2x_feature: on
    l_bonus_3x_feature: off
    l_bonus_4x_feature: off
    l_bonus_5x_feature: off
    l_top_eject_5k: on
    l_top_eject_10k: off
    l_top_eject_20k: off
    l_top_eject_30k: off
    l_drop_target_special: off
