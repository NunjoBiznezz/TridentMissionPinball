#config_version=6

mode:
  start_events: machine_reset_phase_3, game_ended, ball_will_end{device.ball_devices.trough.balls > 0}
  stop_events: game_start_request
  priority: 10
  game_mode: false
  events_when_started: start_attract_mode
  events_when_stopped: stop_attract_mode

show_player:
  start_attract_mode:
    attract_bonus:
      loops: -1
      speed: 1.0
    attract_targets:
      loops: -1
      speed: 1.0
    attract_players:
      loops: -1
      speed: 1.0

segment_display_player:
  start_attract_mode:
    player1_score:
      text: "GAME"
    player2_score:
      text: "OVER"
    player3_score:
      text: "      "
    player4_score:
      text: "      "
    credits_display:
      text: "{machine.credits:02d}"
    ball_display:
      text: " "

variable_player:
  s_left_flipper_active{machine.current_ruleset < 3}:
    current_ruleset:
      int: machine.current_ruleset + 1
      action: set_machine
  s_left_flipper_active{machine.current_ruleset >= 3}:
    current_ruleset:
      int: 1
      action: set_machine
