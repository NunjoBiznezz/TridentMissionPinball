  adj_free_play_off: adjustments_show_setting_16

  # --- Adjustment 17: Ball Save ---
  s_service_active{machine.adj_setting == 17 and machine.adj_ball_save == 0}: adj_ball_save_on
  s_service_active{machine.adj_setting == 17 and machine.adj_ball_save == 1}: adj_ball_save_off
  adj_ball_save_on: adjustments_show_setting_17
  adj_ball_save_off: adjustments_show_setting_17

  # --- Navigation: s_start_button advances through adjustments ---
  s_start_button_active{machine.adj_setting == 1}: adjustments_advance_to_2
