  # --- Adjustment 16: Free Play ---
  s_service_active{machine.adj_setting == 16 and machine.adj_free_play == 0}: adj_free_play_on
  s_service_active{machine.adj_setting == 16 and machine.adj_free_play == 1}: adj_free_play_off
