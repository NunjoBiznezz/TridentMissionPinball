#config_version=6

# Stern Trident Hardware Configuration for LISY Protocol
# RPU v102 board configuration

switches:
  # Cabinet switches
  s_coin_1:
    number: 1
    type: NO
  s_coin_2:
    number: 0
    type: NO
  s_coin_3:
    number: 2
    type: NO
  s_start_button:
    number: 5
    type: NO
    tags: start
  s_tilt:
    number: 6
    type: NO
    tags: tilt
  s_slam:
    number: 7
    type: NO
    tags: slam_tilt

  # Ball management
  s_outhole:
    number: 32
    type: NO
    tags: home, trough

  # Playfield switches
  s_rollover:
    number: 9
    type: NO
  s_ur_sling:
    number: 10
    type: NO
  s_ul_sling:
    number: 11
    type: NO
  s_lr_sling:
    number: 12
    type: NO
  s_ll_sling:
    number: 13
    type: NO
  s_top_bumper:
    number: 14
    type: NO
  s_bottom_bumper:
    number: 15
    type: NO
  s_right_outlane:
    number: 16
    type: NO
  s_right_inlane:
    number: 17
    type: NO
  s_left_inlane:
    number: 18
    type: NO
  s_standup_purple:
    number: 19
    type: NO
  s_standup_yellow:
    number: 20
    type: NO
  s_standup_amber:
    number: 21
    type: NO
  s_standup_green:
    number: 22
    type: NO
  s_standup_white:
    number: 23
    type: NO
  s_saucer:
    number: 25
    type: NO
  s_10_pts:
    number: 26
    type: NO
  s_drop_target_5:
    number: 27
    type: NO
  s_drop_target_4:
    number: 28
    type: NO
  s_drop_target_3:
    number: 29
    type: NO
  s_drop_target_2:
    number: 30
    type: NO
  s_drop_target_1:
    number: 31
    type: NO
  s_left_spinner:
    number: 4
    type: NO
  s_right_spinner:
    number: 3
    type: NO

  # Flipper buttons - NOT part of the original Stern Trident hardware.
  # Requires new switches physically wired into the machine.
  # Numbers 33-34 are assigned in the Arduino RPU implementation.
  s_left_flipper:
    number: 33
    type: NO
  s_right_flipper:
    number: 34
    type: NO

