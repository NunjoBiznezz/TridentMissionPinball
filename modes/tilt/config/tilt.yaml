#config_version=6

# Tilt (original Trident rules)
#
# The plumb bob (s_tilt, tagged tilt_warning) issues warnings; exceeding
# the allowed warnings tilts the ball: slings/bumpers are disabled, no
# bonus is collected (gated in ruleset_original's ball_drain entry), and
# the ball ends once it drains. Warnings reset between balls.
#
# Adjustment 23 (adj_tilt_warnings, 0 or 1) sets how many warnings the
# player gets before tilting: warnings_to_tilt = adj + 1 bob closures.
#
# Flippers are not MPF devices on this machine (1979 Sterns wire them
# through the hardware tilt relay), so MPF only handles game logic.

mode:
  code: mpf.modes.tilt.code.tilt.Tilt
  priority: 1000000
  start_events: machine_reset_phase_3
  game_mode: false
  stop_on_ball_end: false

tilt:
  tilt_warning_switch_tag: tilt_warning
  warnings_to_tilt: (machine.adj_tilt_warnings + 1)
  multiple_hit_window: 300ms
  settle_time: 2s
  tilt_warnings_player_var: tilt_warnings

sound_player:
  tilt_warning: 039_TiltWarning
