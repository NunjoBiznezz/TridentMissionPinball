#config_version=6

mpf:
  default_platform_hz: 1000

machine:
  balls_installed: 3
  min_balls: 1

hardware:
  platform: lisy
  driverboards: lisy
  accelerometer: none
  servo_controller: none
  i2c: none
  switches: lisy
  coils: lisy
  lights: lisy
  dmd: lisy

lisy:
  connection: network
  port: /dev/ttyUSB0
  baud: 115200
  flow_control: none
  network_interface: 127.0.0.1
  network_port: 5963
  debug: true
  platform: stern
  hw_rule_coil_delay: 50ms

displays:
  window:
    width: 800
    height: 600
    title: Stern Trident
    resizable: true
    fullscreen: false
    borderless: false
  dmd:
    width: 128
    height: 32
    default: true

window:
  width: 1024
  height: 768
  title: Mission Pinball Framework
  resizable: true
  fullscreen: false
  borderless: false

modes:
  - base
  - attract
  - game
  - ruleset_selector
  - ruleset_original
  - ruleset_trident2020
  - ruleset_tournament

game:
  balls_per_game: 3
  max_players: 4

settings:
  special_award:
    label: Special Award
    sort: 100
    key: special_award
    value_type: str
    default: extra_ball
    values:
      extra_ball: Extra Ball
      free_game: Free Game
      points_100k: 100,000 Points
      extra_ball_and_free_game: Extra Ball and Free Game

machine_vars:
  current_ruleset:
    initial_value: 1
    value_type: int
    persist: true

player_vars:
  score:
    initial_value: 0
    value_type: int
  ball:
    initial_value: 1
    value_type: int
  drop_phase:
    initial_value: 1
    value_type: int
  saucer_value:
    initial_value: 5000
    value_type: int
  bonus_multiplier:
    initial_value: 1
    value_type: int
  left_lane_value:
    initial_value: 2000
    value_type: int

logging:
  console:
    level: INFO
  file:
    level: DEBUG
    filename: logs/mpf.log