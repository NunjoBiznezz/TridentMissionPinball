#config_version=6

# Development configuration for laptop testing
# Overrides main config for simulation

config:
  - config.yaml
  - ../machine_files/stern_trident.yaml

hardware:
  platform: virtual
  driverboards: virtual
  switches: virtual
  coils: virtual
  lights: virtual
  dmd: virtual

# Virtual hardware for testing
virtual_platform_start_active_switches:
  - s_outhole

# Development logging
logging:
  console:
    level: DEBUG
  file:
    level: DEBUG
    filename: logs/mpf_dev.log

# Faster development settings
mpf:
  default_platform_hz: 30  # Lower for development
  
bcp:
  connections:
    local_display:
      type: mpf.core.bcp.bcp_socket_client.BCPClientSocket
      host: localhost
      port: 5050