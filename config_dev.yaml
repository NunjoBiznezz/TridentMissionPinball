#config_version=6

# Development configuration for laptop testing
# Overrides main config for simulation

config:
  - config.yaml

hardware:
  platform: virtual
  driverboards: virtual
  switches: virtual
  coils: virtual
  lights: virtual
  dmd: virtual

# Virtual hardware for testing
virtual_platform_start_active_switches:
  - s_trough_1
  - s_trough_2 
  - s_trough_3

# Enable keyboard controls for development
keyboard:
  s:
    switch: s_start_button
  z:
    switch: s_left_flipper
  slash:
    switch: s_right_flipper
  x:
    switch: s_left_slingshot
  period:
    switch: s_right_slingshot
  1:
    switch: s_trough_1
    toggle: true
  2:
    switch: s_trough_2
    toggle: true
  3:
    switch: s_trough_3
    toggle: true

# Development logging
logging:
  console:
    level: DEBUG
  file:
    level: DEBUG
    filename: logs/mpf_dev.log

# Faster development settings
mpf:
  default_platform_hz: 30  # Lower for development
  
bcp:
  connections:
    local_display:
      type: mpf.core.bcp.bcp_socket_client.BCPClientSocket
      host: localhost
      port: 5050