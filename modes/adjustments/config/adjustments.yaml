  adjustments_advance_to_8: adjustments_show_setting_8
  s_start_button_active{machine.adj_setting == 8}: adjustments_advance_to_9
  adjustments_advance_to_9: adjustments_show_setting_9
  s_start_button_active{machine.adj_setting == 9}: adjustments_advance_to_10
