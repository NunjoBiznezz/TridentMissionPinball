#config_version=6

# Self-test mode
#
# Entry:      advance past the last service-menu setting (setting 13)
# Cycle item: press s_service to step within the current test
# Next test:  press s_start_button to advance to the next test
# Exit:       pressing s_start_button past test 5 returns to attract
#
# Tests (in order):
#   1 - Lamp test      ball_display=1  player1_score=lamp number (0-59)
#   2 - Display test   all segment displays cycled through patterns
#   3 - Solenoid test  ball_display=3  player1_score=coil number (0-14)
#   4 - Switch test    ball_display=4  player1_score=switch number when closed
#   5 - Sound test     ball_display=5  player1_score=sound number (placeholder)

mode:
  start_events: s_service_active{machine.operator_mode_active == 0}
  stop_events: self_test_exit, enter_adjustments
  priority: 60
  game_mode: false

event_player:
  mode_self_test_started: self_test_start_lamp_test

  # Navigation: s_start_button advances through tests; past test 5 exits
  s_start_button_active{machine.self_test_number == 1}: self_test_start_display_test
  s_start_button_active{machine.self_test_number == 2}: self_test_start_solenoid_test
  s_start_button_active{machine.self_test_number == 3}: self_test_start_switch_test
  s_start_button_active{machine.self_test_number == 4}: self_test_start_sound_test
  s_start_button_active{machine.self_test_number == 5}: self_test_cleanup

  # self_test_cleanup resets number to 0, then transitions to adjustments
  self_test_cleanup: enter_adjustments

  # --- Test 1: Lamp ---
  # Entry clears all lamps then lights lamp 0.
  # Each s_service press steps the lamp index and refreshes.
  self_test_start_lamp_test: self_test_lamp_clear
  self_test_lamp_clear{machine.self_test_number == 1}: self_test_lamp_on
  s_service_active{machine.self_test_number == 1}: self_test_lamp_step
  self_test_lamp_step: self_test_lamp_wrap_check
  self_test_lamp_wrap_check: self_test_lamp_clear

  # --- Test 2: Display ---
  self_test_start_display_test:
    - self_test_lamp_clear
    - self_test_display_refresh
  s_service_active{machine.self_test_number == 2 and machine.self_test_display_pattern == 1}: self_test_display_set_2
  s_service_active{machine.self_test_number == 2 and machine.self_test_display_pattern == 2}: self_test_display_set_3
  s_service_active{machine.self_test_number == 2 and machine.self_test_display_pattern == 3}: self_test_display_set_1
  self_test_display_set_1: self_test_display_refresh
  self_test_display_set_2: self_test_display_refresh
  self_test_display_set_3: self_test_display_refresh

  # --- Test 3: Solenoid ---
  self_test_start_solenoid_test:
    - self_test_lamp_clear
    - self_test_coil_refresh
  s_service_active{machine.self_test_number == 3}: self_test_coil_pulse
  self_test_coil_pulse: self_test_coil_step
  self_test_coil_step: self_test_coil_wrap_check
  self_test_coil_wrap_check: self_test_coil_refresh

  # --- Test 4: Switch ---
  self_test_start_switch_test:
    - self_test_lamp_clear
    - self_test_show_switch_test

  # --- Test 5: Sound ---
  self_test_start_sound_test:
    - self_test_lamp_clear
    - self_test_sound_refresh
  s_service_active{machine.self_test_number == 5}: self_test_sound_step
  self_test_sound_step: self_test_sound_wrap_check
  self_test_sound_wrap_check: self_test_sound_refresh

variable_player:
  # --- Test 1: Lamp ---
  self_test_start_lamp_test:
    self_test_number:
      int: 1
      action: set_machine
    self_test_lamp:
      int: 0
      action: set_machine
  self_test_lamp_step:
    self_test_lamp:
      int: 1
      action: add_machine
  self_test_lamp_wrap_check{machine.self_test_lamp >= 60}:
    self_test_lamp:
      int: 0
      action: set_machine

  # --- Test 2: Display ---
  self_test_start_display_test:
    self_test_number:
      int: 2
      action: set_machine
    self_test_display_pattern:
      int: 1
      action: set_machine
  self_test_display_set_1:
    self_test_display_pattern:
      int: 1
      action: set_machine
  self_test_display_set_2:
    self_test_display_pattern:
      int: 2
      action: set_machine
  self_test_display_set_3:
    self_test_display_pattern:
      int: 3
      action: set_machine

  # --- Test 3: Solenoid ---
  self_test_start_solenoid_test:
    self_test_number:
      int: 3
      action: set_machine
    self_test_coil:
      int: 0
      action: set_machine
  self_test_coil_step:
    self_test_coil:
      int: 1
      action: add_machine
  self_test_coil_wrap_check{machine.self_test_coil >= 15}:
    self_test_coil:
      int: 0
      action: set_machine

  # --- Test 4: Switch ---
  self_test_start_switch_test:
    self_test_number:
      int: 4
      action: set_machine

  # --- Test 5: Sound ---
  self_test_start_sound_test:
    self_test_number:
      int: 5
      action: set_machine
    self_test_sound:
      int: 0
      action: set_machine
  self_test_sound_step:
    self_test_sound:
      int: 1
      action: add_machine
  self_test_sound_wrap_check{machine.self_test_sound >= 1}:
    self_test_sound:
      int: 0
      action: set_machine

  mode_self_test_started:
    operator_mode_active:
      int: 1
      action: set_machine

  # Reset on cleanup before handing off to adjustments
  self_test_cleanup:
    self_test_number:
      int: 0
      action: set_machine

