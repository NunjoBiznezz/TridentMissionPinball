drop_targets:
  dt_1:
    switch: s_drop_target_1
    reset_coil: c_drop_target_1
  dt_2:
    switch: s_drop_target_2
    reset_coil: c_drop_target_2
  dt_3:
    switch: s_drop_target_3
    reset_coil: c_drop_target_3
  dt_4:
    switch: s_drop_target_4
    reset_coil: c_drop_target_4
  dt_5:
    switch: s_drop_target_5
    reset_coil: c_drop_target_5

ball_devices:
  bd_trough:
    ball_switches: s_outhole
    eject_coil: c_outhole
    tags: trough, home, drain
    eject_timeouts: 3s
    confirm_eject_type: playfield
    max_eject_attempts: 3

playfields:
  playfield:
    default_source_device: bd_trough
    tags: default

autofire_coils:
  ac_ul_sling:
    coil: c_ul_sling
    switch: s_ul_sling
  ac_ur_sling:
    coil: c_ur_sling
    switch: s_ur_sling
  ac_ll_sling:
    coil: c_ll_sling
    switch: s_ll_sling
  ac_lr_sling:
    coil: c_lr_sling
    switch: s_lr_sling
  ac_top_bumper:
    coil: c_top_bumper
    switch: s_top_bumper
  ac_bottom_bumper:
    coil: c_bottom_bumper
    switch: s_bottom_bumper
  ac_saucer:
    coil: c_saucer
    switch: s_saucer
